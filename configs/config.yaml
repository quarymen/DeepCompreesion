# Конфигурация проекта CO Autoencoder
# ============================================================

# Пути к данным
data:
  dataset_dir: "../OUTPUT"
  files:
    - "Nsk_2024-07-01_00_00_to_2024-07-02_00_00/all_sources/uvwmn_d03_2024-07-01_00:00:00_n33_chem_13.nc"
    - "Nsk_2024-07-13_00_00_to_2024-07-14_00_00/all_sources/uvwmn_d03_2024-07-13_00:00:00_n33_chem_13.nc"
    - "Nsk_2024-07-28_00_00_to_2024-07-29_00_00/all_sources/uvwmn_d03_2024-07-28_00:00:00_n33_chem_13.nc"
    - "Nsk_2024-08-05_00_00_to_2024-08-06_00_00/all_sources/uvwmn_d03_2024-08-05_00:00:00_n33_chem_13.nc"
    - "Nsk_2024-08-26_00_00_to_2024-08-27_00_00/all_sources/uvwmn_d03_2024-08-26_00:00:00_n33_chem_13.nc"
    - "Nsk_2024-09-05_00_00_to_2024-09-06_00_00/all_sources/uvwmn_d03_2024-09-05_00:00:00_n33_chem_13.nc"
    - "Nsk_2024-09-12_00_00_to_2024-09-13_00_00/all_sources/uvwmn_d03_2024-09-12_00:00:00_n33_chem_13.nc"
    - "Nsk_2025-04-29_00_00_to_2025-04-30_00_00/all_sources/uvwmn_d03_2025-04-29_00:00:00_n33_chem_13.nc"
    - "Nsk_2025-05-09_00_00_to_2025-05-10_00_00/all_sources/uvwmn_d03_2025-05-09_00:00:00_n33_chem_13.nc"
    - "Nsk_2025-05-15_00_00_to_2025-05-16_00_00/all_sources/uvwmn_d03_2025-05-15_00:00:00_n33_chem_13.nc"
    - "Nsk_2025-06-18_00_00_to_2025-06-19_00_00/all_sources/uvwmn_d03_2025-06-18_00:00:00_n33_chem_13.nc"
  
  variable_name: "co"
  val_split_ratio: 0.10        # 10% кадров для валидации (случайная выборка)
  random_seed: 42               # Для воспроизводимости

model:
  # Доступные модели:
  # - PlainConv3DAutoencoder: обычный 3D-CAE без attention
  # - Conv3DAutoencoder: 3D-CAE со старым пространственным SAM3D attention
  # - SimpleConv3DAutoencoder: более простая старая архитектура
  name: "PlainConv3DAutoencoder"
  latent_dim: 64
  dropout_rate: 0.1
  input_shape: [1, 32, 96, 84]  # (channels, depth, height, width)
  use_attention: true
  weight_decay: 0.000001

# Параметры обучения
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001
  early_stopping:
    patience: 10
    min_delta: 0.0001
  scheduler:
    use_scheduler: false      # Отключить scheduler (поставить false)
    step_size: 20
    gamma: 0.5

# Функция потерь
loss:
  alpha: 1.0      # Вес для MSE
  beta: 0.2       # Вес для MAE
  height_weight: 5  # Вес для первых 5 высот

# Сохранение
save:
  models_dir: "models"
  plots_dir: "results/plots"
  predictions_dir: "results/predictions"
  save_best_only: true
  checkpoint_every: 10  # Сохранять чекпоинт каждые N эпох

# Логирование
logging:
  level: "INFO"
  log_every_n_epochs: 5
  tensorboard: false
